# Netlify configuration for Landmaster Planner
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cycle Count -- mobile counter page. Serves count.html at the
# short /count URL so a warehouse counter's bookmark is one word.
# ?c=<token> pass-through works because the redirect is status
# 200 (rewrite, not 301) -- Netlify keeps the query string on
# rewrite so /count?c=c1-marisol lands on count.html?c=c1-marisol.
[[redirects]]
  from = "/count"
  to = "/count.html"
  status = 200

# Schedule the Acumatica sync to run every 2 minutes
[functions."acumatica-sync"]
  schedule = "*/2 * * * *"

# Daily BOM sync -- runs once at 06:00 UTC. Reconciles bom_links from the
# "LM Planner BOM" GI; slow-moving reference data, separate cadence.
[functions."acumatica-bom-sync"]
  schedule = "0 6 * * *"

# Daily Kit sync -- runs once at 06:00 UTC. Reconciles kit_boms from the
# "LM Planner Kit Components" GI; slow-moving reference data, same cadence as BOM.
[functions."acumatica-kit-sync"]
  schedule = "0 6 * * *"

# Daily Service-Usage sync -- runs once at 06:00 UTC. Computes 180-day rolling
# daily-usage rate per LMCOMPO service part from the "LM Planner Service Usage"
# GI and merge-safely writes it to parts.data.daily. Replaces the monthly
# manual Excel Service-Usage Import; the Service Queue reads part.daily
# (unchanged), so this simply refreshes the number every morning.
[functions."acumatica-service-usage-sync"]
  schedule = "0 6 * * *"

# Weekly Production-Orders sync -- Monday 11:00 UTC (~6 AM EST winter / 7 AM
# EDT summer). Reconciles the production_orders table from the "LM Planner
# Production Orders" GI. Feeds the read-only "BOM Usage Weekly" reporting
# tab -- the client mirror DB.productionOrders is READ ONLY and never
# influences partStatus, queueParts, daily rates, or any existing math.
# Poll-only downstream: production_orders is NOT in the realtime publication.
[functions."acumatica-production-orders-sync"]
  schedule = "0 11 * * 1"

# PO-Receipts sync -- split into two cadences that share the same
# runReceiptsSync(mode) in acumatica-po-receipts-sync.js.
#
# FULL sweep -- 06:15 UTC daily. No OData filter, walks the entire
# 180-day GI window, upserts changes. Always writes an audit row so
# ops can confirm the daily reconcile fired.
[functions."acumatica-po-receipts-full"]
  schedule = "15 6 * * *"

# Frame Schedule nightly snapshot -- 05:45 UTC. Copies every
# frame_schedule row (including __settings__) into
# frame_schedule_snapshots with a snapshot_date column so a
# stale-tab clobber like the Sep 5-7 incident is a one-query
# restore instead of a manual rebuild. Retains 60 days; anything
# older is deleted the same tick. See the function header for the
# CREATE TABLE SQL + restore query.
[functions."frame-schedule-snapshot"]
  schedule = "45 5 * * *"

# Phase-A SERVER-SIDE COMPUTE -- every 15 minutes. Runs the shared
# scheduler (lib/frame-scheduler.js) against the same inputs the
# browser uses (frame_schedule + parts) and writes the projected
# plan into frame_schedule_shadow ONLY. Never modifies existing
# tables. Also callable on demand via HTTP (POST/GET); pass
# ?dry=1 to preview without writing. Set env FS_COMPUTE_ENABLED=0
# to disable without deleting the function; remove this stanza to
# stop the cron entirely.
[functions."frame-schedule-compute"]
  schedule = "*/15 * * * *"

# Cycle Count assignment -- weekday mornings at 10:30 UTC (~5:30
# AM Central). HOT tier every weekday (negative on-hand, critical
# cover); RUNWAY + ROTATION on Mondays only. Idempotent; a manual
# retrigger during the same day is safe (per-pn de-dupe against
# today's / this-week's existing items). ?dry=1 previews; ?force=1
# runs on weekends. Deleting this stanza stops assignment without
# affecting the write function or the page. See the function
# header for tunables (HOT_COVER_DAYS, RUNWAY_COVER_DAYS, etc.).
[functions."cycle-count-assign"]
  schedule = "30 10 * * *"

# Inventory Reconciliation nightly ledger -- 05:50 UTC daily.
# Writes one parts_onhand_snapshots row per Base BOM part (same
# exclusions as cycle-count-assign: VMI, pre-launch, phasing-out,
# queued/retired chain members). Each row records physical on-hand,
# chain-aware daily use, receipts_qty since prev snapshot (by date
# range so a missed night doesn't orphan receipts), workday-aware
# usage_est, and residual = (on_hand - prev.on_hand) - receipts +
# usage. Manual re-triggerable at GET /.netlify/functions/parts-
# onhand-snapshot; ?dry=1 previews, ?anchor=1 forces an anchor row.
# 180-day retention; RLS anon SELECT. Read-only against parts /
# part_locations / po_receipts / cycle_count_log; NEVER writes
# on-hand. See the function header for the CREATE TABLE SQL.
[functions."parts-onhand-snapshot"]
  schedule = "50 5 * * *"

# INCREMENTAL sweep -- every 30 minutes. Adds a "Date ge datetime'...'"
# filter with a 5-day lookback (v7.4 -- Edm.DateTime literal, falls back
# to datetimeoffset and then to a full sweep if the tenant rejects
# both). Wire response is typically a single short page. Audit rows
# only emitted when data actually changed (so 48x/day does not spam
# the audit table with no-ops). Diffs against a SCOPED existing-row
# lookup so cost stays O(feedSize) regardless of po_receipts archive
# size.
[functions."acumatica-po-receipts-incremental"]
  schedule = "*/30 * * * *"
