# Netlify configuration for Landmaster Planner
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Schedule the Acumatica sync to run every 2 minutes
[functions."acumatica-sync"]
  schedule = "*/2 * * * *"

# Daily BOM sync — runs once at 06:00 UTC. Reconciles bom_links from the
# "LM Planner BOM" GI; slow-moving reference data, separate cadence.
[functions."acumatica-bom-sync"]
  schedule = "0 6 * * *"

# Daily Kit sync — runs once at 06:00 UTC. Reconciles kit_boms from the
# "LM Planner Kit Components" GI; slow-moving reference data, same cadence as BOM.
[functions."acumatica-kit-sync"]
  schedule = "0 6 * * *"

# Daily Service-Usage sync — runs once at 06:00 UTC. Computes 180-day rolling
# daily-usage rate per LMCOMPO service part from the "LM Planner Service Usage"
# GI and merge-safely writes it to parts.data.daily. Replaces the monthly
# manual Excel Service-Usage Import; the Service Queue reads part.daily
# (unchanged), so this simply refreshes the number every morning.
[functions."acumatica-service-usage-sync"]
  schedule = "0 6 * * *"

# TEMPORARY schedule bump — one-shot manual trigger to verify the sync
# after adding the Status column. Will be reverted immediately after the
# run lands. Original: "0 11 * * 1" (Monday 11:00 UTC).
# Bumped: 13:17 UTC today (2026-08-11). Fires daily at 13:17 UTC until
# reverted, so DO NOT leave this in place past the first successful run.
[functions."acumatica-production-orders-sync"]
  schedule = "17 13 * * *"
